<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان امن وب | Web-based Encrypted Messenger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CryptoJS CDN (جهت رمزنگاری AES) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* شخصی‌سازی اسکرول‌بار */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col justify-between">

    <!-- ۱. هدر پیام‌رسان -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-lg font-bold text-white">پیام‌رسان امن رمزشده</h1>
        </div>
        <div class="flex items-center gap-4 text-xs text-gray-400">
            <span id="user-display" class="bg-gray-700 px-3 py-1 rounded-full text-blue-300 font-medium">وارد نشده‌اید</span>
            <span class="hidden sm:inline">طراح و توسعه‌دهنده: علیرضا میرعلائی</span>
        </div>
    </header>

    <!-- ۲. بخش تنظیمات ورود / رمزنگاری (Modal/Bar) -->
    <section class="bg-gray-800/80 backdrop-blur-md p-3 border-b border-gray-700/50 flex flex-wrap gap-2 items-center justify-between text-sm">
        <div class="flex items-center gap-2 flex-1 min-w-[250px]">
            <input type="text" id="username-input" placeholder="نام کاربری شما..." class="bg-gray-700 text-white px-3 py-1.5 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 w-36 text-xs">
            <input type="text" id="receiver-input" placeholder="گیرنده (مثلا: کاربر۲ یا ALL)" value="ALL" class="bg-gray-700 text-white px-3 py-1.5 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-500 w-36 text-xs">
        </div>
        <div class="flex items-center gap-2 flex-1 min-w-[250px]">
            <input type="password" id="secret-key-input" placeholder="کلید رمزنگاری مشترک (AES)" class="bg-gray-700 text-amber-300 px-3 py-1.5 rounded-lg border border-gray-600 focus:outline-none focus:border-amber-500 flex-1 text-xs">
            <button onclick="saveConfig()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">ذخیره تنظیمات</button>
        </div>
    </section>

    <!-- ۳. پنجره چت (نمایش پیام‌ها) -->
    <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3 bg-gradient-to-b from-gray-900 to-gray-950">
        <div class="text-center text-gray-500 text-xs my-4">
            🔒 تمام پیام‌ها قبل از ارسال به گوگل شیت، با کلید اختصاصی شما رمزنگاری می‌شوند.
        </div>
    </main>

    <!-- ۴. فرم ارسال پیام -->
    <footer class="bg-gray-800 p-3 border-t border-gray-700">
        <form onsubmit="handleSend(event)" class="flex gap-2 max-w-5xl mx-auto">
            <input type="text" id="message-input" placeholder="پیام خود را وارد کنید..." autocomplete="off" class="flex-1 bg-gray-700 text-white px-4 py-2.5 rounded-xl border border-gray-600 focus:outline-none focus:border-blue-500 placeholder-gray-400 text-sm">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition flex items-center gap-1 shadow-lg shadow-blue-900/40">
                <span>ارسال</span>
                <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
    </footer>

    <!-- ۵. اسکریپت اصلی فرانت‌اند -->
    <script>
        // *** آدرس Web App گوگل اسکریپت خود را اینجا قرار دهید ***
        const API_URL = "https://script.google.com/macros/s/AKfycbx_YOUR_SCRIPT_ID_HERE/exec";

        let currentUser = localStorage.getItem('msg_username') || '';
        let secretKey = localStorage.getItem('msg_secretKey') || '';
        let targetReceiver = localStorage.getItem('msg_receiver') || 'ALL';

        // بارگذاری تنظیمات ذخیره شده
        document.addEventListener("DOMContentLoaded", () => {
            if (currentUser) document.getElementById('username-input').value = currentUser;
            if (secretKey) document.getElementById('secret-key-input').value = secretKey;
            if (targetReceiver) document.getElementById('receiver-input').value = targetReceiver;
            
            updateUserDisplay();
            loadMessages();
            
            // به‌روزرسانی خودکار هر ۵ ثانیه یک‌بار (Polling)
            setInterval(loadMessages, 5000);
        });

        function saveConfig() {
            currentUser = document.getElementById('username-input').value.trim();
            secretKey = document.getElementById('secret-key-input').value.trim();
            targetReceiver = document.getElementById('receiver-input').value.trim() || 'ALL';

            if (!currentUser || !secretKey) {
                alert("لطفاً هم نام کاربری و هم کلید رمزنگاری را وارد کنید.");
                return;
            }

            localStorage.setItem('msg_username', currentUser);
            localStorage.setItem('msg_secretKey', secretKey);
            localStorage.setItem('msg_receiver', targetReceiver);

            updateUserDisplay();
            loadMessages();
            alert("تنظیمات با موفقیت ذخیره شد!");
        }

        function updateUserDisplay() {
            const display = document.getElementById('user-display');
            if (currentUser) {
                display.innerText = `کاربر: ${currentUser}`;
                display.classList.replace('text-gray-400', 'text-blue-300');
            } else {
                display.innerText = "وارد نشده‌اید";
            }
        }

        // تابع ارسال پیام
        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const rawText = input.value.trim();

            if (!rawText) return;
            if (!currentUser || !secretKey) {
                alert("لطفاً ابتدا نام کاربری و کلید رمزنگاری را تنظیم کنید.");
                return;
            }

            // ۱. رمزنگاری پیام با الگوریتم AES
            const encryptedText = CryptoJS.AES.encrypt(rawText, secretKey).toString();

            // پاک کردن اینپوت
            input.value = '';

            // ۲. ارسال درخواست به Google Apps Script
            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "sendMessage",
                        sender: currentUser,
                        receiver: targetReceiver,
                        encryptedContent: encryptedText
                    })
                });

                // دریافت مجدد پیام‌ها پس از ارسال
                loadMessages();
            } catch (err) {
                console.error("خطا در ارسال پیام:", err);
                alert("خطا در ارسال پیام به سرور.");
            }
        }

        // تابع دریافت و بازگشایی پیام‌ها
        async function loadMessages() {
            if (!API_URL || API_URL.includes("YOUR_SCRIPT_ID")) return;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "getMessages",
                        user: currentUser
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    renderMessages(result.messages);
                }
            } catch (err) {
                console.error("خطا در دریافت پیام‌ها:", err);
            }
        }

        // رندر کردن پیام‌ها در UI
        function renderMessages(messages) {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '<div class="text-center text-gray-500 text-xs my-2">🔒 ارتباط امن AES-256 فعال است</div>';

            messages.forEach(msg => {
                let decryptedText = "";
                let isDecrypted = false;

                // تلاش برای رمزگشایی پیام با کلید فعلی
                if (secretKey) {
                    try {
                        const bytes = CryptoJS.AES.decrypt(msg.content, secretKey);
                        decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                        if (decryptedText) isDecrypted = true;
                    } catch (e) {
                        isDecrypted = false;
                    }
                }

                const isMe = (msg.sender === currentUser);
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex flex-col ${isMe ? 'items-start' : 'items-end'} mb-2`;

                const msgBubble = document.createElement('div');
                msgBubble.className = `max-w-[80%] rounded-2xl px-4 py-2 text-sm shadow-md ${
                    isMe 
                        ? 'bg-blue-600 text-white rounded-br-none' 
                        : 'bg-gray-800 border border-gray-700 text-gray-200 rounded-bl-none'
                }`;

                // قالب متنی پیام
                if (isDecrypted) {
                    msgBubble.innerHTML = `
                        <div class="text-[10px] opacity-75 mb-1 font-bold ${isMe ? 'text-blue-200' : 'text-amber-400'}">
                            ${escapeHtml(msg.sender)} ➔ ${escapeHtml(msg.receiver)}
                        </div>
                        <p class="break-words leading-relaxed">${escapeHtml(decryptedText)}</p>
                    `;
                } else {
                    // اگر کلید اشتباه باشد یا رمزشده بماند
                    msgBubble.innerHTML = `
                        <div class="text-[10px] text-red-400 mb-1 font-bold">🔒 پیام رمزشده (کلید نامعتبر)</div>
                        <p class="text-xs font-mono text-gray-400 break-all">${escapeHtml(msg.content.substring(0, 30))}...</p>
                    `;
                }

                msgWrapper.appendChild(msgBubble);
                chatBox.appendChild(msgWrapper);
            });

            // اسکرول خودکار به پایین‌ترین پیام
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // بهینه‌سازی امنیتی خروجی متون (مقابله با XSS)
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
